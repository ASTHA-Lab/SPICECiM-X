[DATA]
dataset = cifar10
data_root = ./data
img_height = 32
img_width = 32
channels = auto
val_split = 0.1
num_workers = 4
augment = true

[MODEL]
patch_size = 4
d_model = 192
n_heads = 6
d_k = 0
d_v = 0
depth = 9
mlp_ratio = 2.0
dropout = 0.1
num_classes = 10
use_class_token = true
pos_embed = learnable

[TRAIN]
epochs = 300
batch_size = 128
lr = 3e-4
weight_decay = 0.05
betas = 0.9,0.999
warmup_epochs = 0
lr_scheduler = none
seed = 42
amp = true
device = auto
log_interval = 50

[SAVE]
out_dir = ./cifar10/cifar10_large_vit_outputs
save_weights = true
save_best = true
# Start each run with a clean slate: move this batch's folders
# (<hwsimdb_root|dump_root|tmp_root>/<images_dir name>) to ./trash and delete
# them in the background. Other batches and the characterisation cache in
# supports/ are never touched. false = keep previous run's working files.
clean_workspace = true

[HW]
# ReRAM device physics (Cu/HfO2 from your original setup)
Tox  = 5.0e-9
Tref = 4.7249e-9
Ik1  = 6.14e-5
Vref = 0.43
Tmax = 4.9e-9
Tmin = 3.3e-9
# Crossbar tiling
subarray_rows = 16
subarray_cols = 16
pe_rows = 2
pe_cols = 2
tile_rows = 2
tile_cols = 2
# Input voltage range for activation encoding
vmin = 0.0
vmax = 0.6
# Access Transistor Resistance mode 40nm: 4.4e3, 90nm: 10.1e3, 180nm: 13.2e3
R_access = auto

[SIM]
# transient | dc | fastdc | hybrid | auto — start with 'dc' for fastest sweeps.
# auto = transient pass (power/energy/latency on 1 image) + fastdc pass (accuracy).
mode = auto
# ── Operating point (process corner / supply / temperature) ──
# process_corner = the section name in your transistor model .scs (tt/ss/ff/stat).
# vdd/vss = supply rails (V). temperature = ambient (deg C).
# tnom = nominal model-extraction temperature (deg C; overrides a literal tnom in
# the golden decks).
process_corner = tt
vdd = 1.1
vss = 0.0
temperature = 25.0
tnom = 27.0
# Cap on concurrent Spectre invocations.  Set to # of available seats.
license_count = 16
pipeline_postprocess = true
# Transient settling window (fraction of pulse — middle plateau)
# Transient drive pulse (per MVM step)
pulse_width = 1e-9
trise = 1e-12
tfall = 1e-12
settling_window_lo = 0.4
settling_window_hi = 0.65
settling_reducer = median
# Hybrid mode: fraction of subarrays cross-checked with transient (0 disables)
hybrid_transient_fraction = 0.0
hybrid_transient_seed = 0
# ── auto-mode transient image selection ──
# Priority: auto_transient_image (a filename) > auto_transient_image_index
# (>=0, legacy) > random sampling.
# auto_transient_image: run the transient pass on EXACTLY this image (name as
# it appears in images_dir, e.g. img_0007.png). Empty = not used.
auto_transient_image =
# Number of DISTINCT random images for the transient pass (used when no fixed
# image/index is set). With N > 1 the transient pass runs once per image and
# the reported crossbar energy/power is the AVERAGE over the N inferences
# (per-image values are kept in the report JSON and in
# dump/timgXX_<name>/crossbar_power/). Peripheral energy and latency are
# count-based and identical across images.
auto_transient_num_images = 1
# -1 = random (see above); >=0 = that index into the sorted image list (legacy)
auto_transient_image_index = -1
auto_transient_seed = 0
# V grid of the cell table at [PATHS] char_table_path. A .npz built by
# cli.characterize stores its own grid; a .csv has no V axis, so these must
# match its column count (0.0 .. 1.0 V in 0.01 V steps = 101 columns)
fastdc_V_min  = 0.0
fastdc_V_max  = 1.0
fastdc_V_step = 0.01
array_char_V_min        = 0.0
array_char_V_max        = 0.6
# 101 V_BL points
array_char_V_step       = 0.1
# 0.01 nm — gives 161 T points      
array_char_T_step       = 0.1e-9
# your inference subarray size   
array_char_size_primary   = 16
# second anchor for cross-N interpolation      
array_char_size_secondary = 32
# which IPRB to save (all identical at uniform T)      
array_char_probe_column   = 0       
# Per-Spectre-call wall-clock timeout (seconds) for the ONE-TIME
# characterisations.  The array build (N x N, full T x V grid) is the long one;
# raise it for large arrays / fine grids / loaded clusters.  Bounds only the
# build-time characterisation, never inference.
array_char_timeout_s      = 7200
cell_char_timeout_s       = 3600
# all | last_block | none
hwsimdb_retention = last_block
# A Spectre job that still fails after its retries: raise (stop, default) or
# nan (mark that subarray's outputs NaN and continue).
on_job_failure = raise
# Wall-clock limit per inference Spectre job (s); 0 = none.
spectre_timeout_s = 0

[PATHS]
project_dir            = .
images_dir             = ./Test_Image/t1
dump_root              = imc_traces
hwsimdb_root           = ./hwsimdb
tmp_root               = ./tmp
golden_input_transient = ./supports/_golden_input.scs
golden_input_dc        = ./supports/_golden_input_dc.scs
# Std cells (1T1R cell, BL_DRIVER, decoders) for YOUR PDK. Not shipped: start
# from ./supports/standard_cell.netlist and swap in your PDK's device names
# (see supports/README.md and [PDK] transistor_model_name below).
stdcell_netlist        = ./supports/standard_cell_45nm.netlist
device_model_transient = ./supports/reram_cell.v
device_model_dc        = ./supports/sky130_dc_memristor_dc.v
# Spectre model file of your PDK (not distributable; Cadence GPDK 45 nm here)
transistor_model       = /path/to/gpdk045_v_6_0/models/spectre/gpdk045.scs
# Built by `python -m spicecimx.cli.characterize --config config_cifar10.ini`
char_table_path        = ./supports/cell_table_45nm.npz
# Built (and re-built when the hardware changes) by cli.characterize_array / cli.infer
array_table_path       = ./supports/array_table_45nm_tt.npz
# Hardware (H) peripherals for [SUBCIRCUITS]: DAC_8b / TIA_8b / SUBTRACTOR_8b /
# ADC_8b (behavioural Verilog-A, 45 nm / 1.1 V). Only read when a role is H.
peripheral_netlist     = ./supports/peripherals/peripherals_8b.scs

[PERIPHERALS]
# Master switch: when true, infer.py reduces the crossbar SPICE power CSVs
# (transient mode), writes the operation manifest, and emits the consolidated
# power / energy / latency / TOPS-W report via analog.pwr_energy.
generate_energy_report = true
# Technology node (nm) — used by the accelergy ADC model and for reference.
tech_node_nm = 45
# DAC resolution (bits) for the switched-cap energy model.
dac_bits = 8
# ── ADC / TIA operating range (resolution + input / full-scale voltages) ──
adc_bits = 8
# TIA output window (the calibrated layer current range maps onto it) and ADC
# full-scale voltage (codes span 0 .. vmax_adc).
vmin_tia = 0.0
vmax_tia = 0.6
vmax_adc = 0.6
enable_qerror = false
# Per-layer TIA/ADC calibration: learned from the first N images (one call per
# batch with --batch_all), then frozen. 0 = never freeze.
tia_calib_images = 1
# ADC energy model: 'walden' (E = FOMW*2^ENOB, Murmann survey) or
# 'accelergy' (Schreier-FOM best-possible envelope, tech-node aware).
adc_energy_model = accelergy
# Walden FOMW in fJ/conv-step. Survey medians: ~30 overall, ~22.5 SAR, ~1.3 SOTA.
adc_fom_fJ_per_convstep = 22.5
# Full-scale column current (A) for the physical TIA+ADC characterisation
# sweep (feature 5). Set to bracket your crossbar's max column current.
adc_i_fullscale = 8e-4
# ENOB for the ADC energy model; leave <0 to use peripherals.adc_bits.
adc_enob = -1
# DAC energy: set a measured pJ/conv (>0) to use it directly; else the
# switched-cap model E = activity*C*Vref^2*2^bits below is used.
dac_energy_pJ_per_conv = -1
dac_cap_fF = 50
dac_vref_V = 0.2
dac_switching_activity = 0.3333
# TIA static-bias model: E = I_bias*V_sup*t_active. t_active<0 → one clock period.
tia_bias_current_A = 20e-6
tia_supply_V = 1.1
tia_active_time_s = -1
# Multiplexer (converter sharing) energy. A mux is charged only when
# num_dac/num_adc (in [LATENCY]) is smaller than a layer's I/O width.
# Set mux_energy_pJ_per_op>0 to use a measured value; else transmission-gate
# model E = stages * mux_cap_fF * mux_vdd_V^2 per routed conversion.
mux_energy_pJ_per_op = -1
mux_cap_fF = 2.0
mux_vdd_V = 1.1
# Differential readout: each output uses a +column TIA and a -column TIA
# feeding a subtractor, then the ADC. true => 2 TIAs + 1 subtractor/output.
differential_columns = true
subtractor_energy_pJ_per_op = -1
subtractor_cap_fF = 10.0
subtractor_vdd_V = 1.1
# Bit-slicing: counts multiply when each weight slice is digitised separately.
n_bit_slices = 1
adc_per_slice = false
# ── Operating-point / technology scaling (fixes corner/node-blind peripherals) ──
# track_operating_point = true: every modelled peripheral energy follows the
# corner supply ([SIM] vdd): dynamic CV^2 blocks (DAC/ADC/MUX/SUBTRACTOR) scale
# (V/Vnom)^2, static-bias blocks (TIA) scale (V/Vnom). Vnom defaults to the
# per-node industry table in analog/tech_scale.py (180nm:1.8V, 90:1.2, 40:1.1,
# ..., 3nm:0.6); override with nominal_vdd_V if your PDK differs.
track_operating_point = true
nominal_vdd_V = 1.1
# energy_node_scaling = true: additionally project the peripheral constants
# from energy_ref_node_nm to tech_node_nm (C ~ node, V ~ per-node nominal),
# so ONE reference config covers 180nm -> 3nm without retuning caps/supplies.
energy_node_scaling = false
energy_ref_node_nm = 0

[LATENCY]
# Cycle-accurate latency. Total = DAC conv cycles + MAC/VMM settle cycles +
# ADC conv cycles, at this clock.  1 GHz -> 1 ns clock period.
clock_freq_hz = 500e6
# Number of physical DAC / ADC units working in parallel.
num_dac = 8
num_adc = 8
# ADC architecture sets cycles/conversion: sar -> bits+1, flash/pipeline -> 1,
# integrating -> 2^bits, sigma_delta -> adc_osr (or 2^bits).
adc_type = sar
# Override cycles/conversion explicitly (0 = derive from adc_type & adc_bits).
adc_cycles_per_conv = 0
dac_cycles_per_conv = 1
# Analog VMM settle cycles per input vector per subarray wave.
mac_cycles_per_vector = 1
# Subarrays evaluated spatially in parallel (0 = pe_rows*pe_cols*tile_rows*tile_cols).
vmm_parallel_subarrays = 0
# Sigma-delta oversampling ratio (0 = 2^adc_bits).
adc_osr = 0
# Extra clock cycles per muxed conversion wave (mux settle); 0 = folded in.
mux_cycles = 0
# ── Technology / corner / temperature aware timing ──
# 'fixed' = one clock for every stage (legacy; tech/corner-flat latency).
# 'node_scaled' = converter cycle time scales with the node (FO4 ~ gate
# length, anchored at ref_node_nm), the process corner (ff/ss drive spread)
# and temperature; the analog MVM term uses the SPICE-measured settle time
# from the transient waveforms when available (corner-accurate).
periph_delay_model = node_scaled
ref_node_nm = 45
node_delay_exponent = 1.0
# Corner delay multipliers (typical timing spread) and temperature slope.
corner_delay_ff = 0.85
corner_delay_ss = 1.30
temp_delay_coeff_per_C = 0.001
# Tolerance band (fraction of steady state) for the measured analog settle.
settle_band = 0.02

[SUBCIRCUITS]
# role = subckt_name, mode   where mode is S (software model) or H (hardware:
# the named subckt from [PATHS] stdcell_netlist / peripheral_netlist is
# characterised once with Spectre and its measured transfer + energy are used
# in every simulation mode).  Pin list and bit width are parsed from the
# netlist.  tia/subtractor = H take effect together with adc = H.  The
# multiplexer is energy-modelled only; the cell and bl_driver rows are
# informational (cells come from [PDK] cell_prefix, BL_DRIVER from the std cells).
multiplexer = MUX, S
dac = DAC_8b, S
adc = ADC_8b, S
tia = TIA_8b, S
subtractor = SUBTRACTOR_8b, S
cell = rram_cell_1T1R_180N_STD, H
bl_driver = BL_DRIVER, H

[PDK]
# Process/PDK-specific values that used to be hardcoded in device_emit.py /
# netlist.py. Changing technology node or cell library = edit ONLY this section.
# Access-transistor instance geometry (strings: carry units like 2u, 180n):
#l=45n nf=1 as=140f ad=140f ps=2.28u \ pd=2.28u nrd=140m nrs=140m sa=140n sb=140n sd=160n sca=72.26287 \ scb=0.06569 scc=0.00861 m=(1)
transistor_model_name = g45n1svt
transistor_w  = 2u
transistor_l  = 90n
transistor_as = 140f
transistor_ad = 140f
transistor_ps = 2.28u
transistor_pd = 2.28u
transistor_m  = (1)
wl_read_V = 1.1
# ReRAM Verilog-A primitive cell names (transient / DC):
va_cell_transient = sky130_fd_pr_reram__reram_cell
va_cell_dc        = sky130_dc_memristor_dc
# 1T1R cell subckt prefix (must match across device_emit + netlist):
cell_prefix = rram_cell_1T1R_180N_STD
# Verilog-A device params NOT already in [HW] (Tox/Tmax/Tmin/Tref/Ik1/Vref
# come from [HW]); these are the area + dynamics:
va_area_ox            = 1.024e-13
va_eact_generation    = 1.501
va_eact_recombination = 1.5
va_velocity_k1        = 150
va_gamma_k0           = 16.5
va_gamma_k1           = -1.25
va_temperature_0      = 300
va_c_thermal          = 3.1825e-16
va_tau_thermal        = 2.3e-10
va_t_step             = 1e-9
# Transient ReRAM model: 0 = read mode (filament frozen at the programmed
# weight), 1 = dynamic SET/RESET model (drifts during long reads).
va_enable_switching   = 0

[PARASITICS]
# Crossbar interconnect (wire) R/C. Each BL (row input) and SL (column output)
# is split into per-cell segments joined by series resistors (+ optional node
# caps), reproducing IR-drop (far-corner cells read low). Strongly node-
# dependent: ~1-2.5 ohm & ~0.1-0.2 fF/cell at 180nm, kohm at sub-30nm.
# enable=false (or r=c=0) -> ideal zero-parasitic crossbar.
enable = false
r_wire_per_cell_ohm = 2.5
c_wire_per_cell_fF  = 0.2
model_wl = false
r_wl_per_cell_ohm = 2.5
driver_at_origin = true

[INTERCONNECT]
# What the RSN decomposition leaves out (TUTORIAL.md 5.1): the lines joining a
# layer's subarrays (loading) and the NoC joining the tiles.
enable = true
# Shared column lines (KCL partial-sum accumulation into one TIA per column):
# transient re-simulates every RSN deck with the solved boundary (loaded RSN).
loading = true
# buffered = row drivers per subarray (DAC bus capacitive only) | shared
input_bus = buffered
# SPICE passes (1 = ideal RSN + predicted correction) and stop tolerance (V)
loading_max_passes = 3
loading_tol_V = 1e-3
# 0 = auto: cell pitch from [PDK] transistor_w and the node; semi-global wire
cell_pitch_x_um = 0
cell_pitch_y_um = 0
subarray_gap_um = 5
tile_gap_um = 20
wire_r_ohm_per_um = 0
wire_c_fF_per_um = 0.2
driver_r_out_ohm = 50
bus_tap_c_fF = 2
# auto = (vmax_tia - vmin_tia) / adc_i_fullscale / (1 + tia_open_loop_gain)
tia_r_in_ohm = auto
tia_open_loop_gain = 100
# none | analytic | booksim (analytic + BookSim2 check of the unicast traffic)
noc = analytic
noc_multicast = true
noc_flit_bits = 64
noc_packet_flits = 4
noc_clock_hz = 1e9
noc_router_cycles = 2
noc_link_cycles = 1
# -1 = auto (BookSim2/Orion router 0.110 pJ/bit @32nm, C*V^2-scaled; link 0.5*C*V^2/mm)
noc_router_energy_pJ_per_bit = -1
noc_link_energy_pJ_per_bit_mm = -1
noc_buffer = center
noc_mesh_cols = 0
noc_overlap = false
# patched BookSim2: bash SPICECIMX_V3/scripts/booksim/build_booksim.sh <dir>
booksim_binary =

[ACCURACY]
# Torch-vs-GT, IMC-vs-GT, SW-HW agreement. task selects the metric set
# (classification now; register a new core.metrics.Task for LLMs later).
generate_accuracy_report = true
task = classification
# Ground-truth labels (optional). labels_file: CSV "filename,label" or JSON map.
# label_from_filename: regex whose first () group captures the label.
labels_file =
label_from_filename =
topk = 1,5